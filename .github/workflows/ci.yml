name: CI

on:
  pull_request:
  push:
    branches:
      - main

# ソースの読み取り以外の権限を与えず、検証用Workflowからリポジトリを変更できないようにします。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Test download authorization
        run: npm test

      - name: Build static site
        run: npm run build

      # Critical/Highの既知脆弱性は、レビュー前に失敗として扱います。
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
