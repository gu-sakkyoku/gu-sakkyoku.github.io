name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 本番Worker/Turnstileの公開設定が揃うまで、サイトを誤って公開しないための条件です。
# Repository Settings > Pages で Source = GitHub Actions も設定してください。
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.NEXT_PUBLIC_DOWNLOAD_WORKER_URL != '' && vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check public configuration
        env:
          NEXT_PUBLIC_DOWNLOAD_WORKER_URL: ${{ vars.NEXT_PUBLIC_DOWNLOAD_WORKER_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          node -e 'const u = new URL(process.env.NEXT_PUBLIC_DOWNLOAD_WORKER_URL); if (u.protocol !== "https:" || ["localhost", "127.0.0.1"].includes(u.hostname) || process.env.NEXT_PUBLIC_TURNSTILE_SITE_KEY === "1x00000000000000000000AA") process.exit(1)'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_DOWNLOAD_WORKER_URL: ${{ vars.NEXT_PUBLIC_DOWNLOAD_WORKER_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
